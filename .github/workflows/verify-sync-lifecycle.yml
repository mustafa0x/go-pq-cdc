name: Verify sync lifecycle contract

on:
  pull_request:
    branches: [sync-lifecycle-base]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
      - name: Test clean lifecycle commit
        run: go test ./...
      - name: Resolve module metadata
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/mustafa0x/go-pq-cdc@${{ github.event.pull_request.head.sha }})
          printf '%s\n' "$version" > connector-version.txt
          go mod download -json github.com/mustafa0x/go-pq-cdc@"$version" > connector-module.json
      - uses: actions/upload-artifact@v4
        with:
          name: connector-module
          path: |
            connector-version.txt
            connector-module.json
