name: Verify sync lifecycle contract

on:
  pull_request:
    branches: [sync-lifecycle-base]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
      - name: Test clean lifecycle commit
        run: go test ./...
      - name: Resolve module version
        run: go list -m -f '{{.Version}}' github.com/mustafa0x/go-pq-cdc@${{ github.event.pull_request.head.sha }} > connector-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: connector-version
          path: connector-version.txt
