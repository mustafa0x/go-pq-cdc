name: Verify sync lifecycle contract

on:
  pull_request:
    branches: [sync-lifecycle-base]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
      - name: Test clean lifecycle commit
        run: |
          git show -s --format='COMMIT_TIME=%cI'
          go test ./...
